# Project-wide Gradle settings.
# NOTE: No secrets belong in this file or anywhere else in the repo. The API
# base URL is a build-config value (see app/build.gradle.kts) and defaults to a
# local dev server; override it per-developer via a Gradle property in your
# *user* ~/.gradle/gradle.properties or an env var — never commit real hosts or
# tokens.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX + Kotlin.
android.useAndroidX=true
kotlin.code.style=official

# Non-transitive R classes keep module R files small and build faster.
android.nonTransitiveRClass=true

# Default API base URL used when no override is supplied at build time.
# Points at the loopback alias the Android emulator uses to reach the host
# machine's Node/TypeScript backend on port 3000. Override with:
#   -PconsoleApiBaseUrl=https://your-dev-host.example/  (Gradle property)
CONSOLE_API_BASE_URL=http://10.0.2.2:3000/
